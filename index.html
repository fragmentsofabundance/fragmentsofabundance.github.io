<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160f20">
  <meta name="description" content="Fragments of Abundance is under construction.">
  <title>Fragments of Abundance</title>
  <link rel="icon" href="/assets/brand/foa-logogram.png">
  <style>
    :root {
      color-scheme: dark;
      background: #160f20;
      color: #ece7ee;
      font: 1rem/1.5 Arial, Helvetica, sans-serif;
    }
    body {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
    }
    main {
      width: min(100%, 400px);
      text-align: center;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    h1 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 400;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }
    a {
      display: inline-block;
      padding: 10px 6px;
      color: #66ff99;
      text-underline-offset: .2em;
    }
    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/foa-landscape.png" width="760" height="380" alt="Fragments of Abundance">
    <h1>Under construction</h1>
    <nav aria-label="Contact">
      <a href="mailto:fragmentsofabundance@gmail.com">Email</a>
      <span aria-hidden="true">·</span>
      <a href="https://www.instagram.com/fragmentsofabundance/">Instagram</a>
    </nav>
  </main>
</body>
</html>
